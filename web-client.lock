# Embedded web client.
#
# The release of the first-party web client that release builds of the server
# embed. The pin is consumed by `cargo xtask fetch-web-client`, which downloads
# the archive, verifies its `sha256` before extracting it, and unpacks it into
# `target/web-client/`, where the server crate embeds it at compile time. A
# fetch is skipped when `target/web-client/.version` already records this
# version and digest.
#
# Format: one `[web_client]` table, with
#
#   version released web client version; the release tag is `v<version>`
#   url     direct download URL of the `.zip` release asset
#   sha256  lowercase hex SHA-256 of that asset, checked on every download
#
# Update the pin only together with a release whose digest was computed from
# the published asset.

[web_client]
version = "0.2.5"
url = "https://github.com/hearthsound/hearthsound-web/releases/download/v0.2.5/hearthsound-web-0.2.5.zip"
sha256 = "2f7ed5ca05d99e37970823560d659a5d074f8baab14f0f8a603c62f591ac38ea"
