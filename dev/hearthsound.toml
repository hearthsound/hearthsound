# Configuration for the development stack in `dev/compose.yml`. Every path here
# is a container path; the compose file mounts the host directories at them.
#
# Bootstrap keys are read from this file and from `HEARTHSOUND__SECTION__KEY`
# environment variables, and the environment wins (operations guide, section
# 3.2). The compose file sets the same values, so the file is what a bare
# `docker run` or a local `cargo run` would need.

[server]
bind = "0.0.0.0"
port = 4327

[paths]
data = "/data"
storage = "/storage"

[database]
path = "/data/hearthsound.db"

[log]
level = "info"
format = "text"

# Runtime settings live in the database and are edited through the API or the
# admin UI. A runtime setting can be pinned read-only by putting it in the
# `[settings]` table, which is how an operator enforces policy: a pinned key
# rejects API edits. For example, to make a stream pad silence instead of
# waiting for the first acquired file:
#
# [settings]
# "stream.pending.mode" = "pad"
