# Development stack: Hearthsound built from this repository. Run it from the
# repository root:
#
#   docker compose -f dev/compose.yml up --build
#
# `dev/data`, `dev/storage` and `dev/imports` are runtime state next to this
# file and are not committed. Bootstrap keys are given both here and in
# `dev/hearthsound.toml`, which is mounted read-only as the config file; the
# environment wins where they overlap.
#
# No acquisition backend runs here. To acquire through one, run it yourself and
# have it write its downloads into the folder mounted at `/imports` (by default
# `dev/imports`, overridden by `HEARTHSOUND_IMPORTS_DIR`), then grant that
# folder to the plugin instance with
# `hearthsound providers add ... --import-root <id>=/imports/<subfolder>:<mode>`.

name: hearthsound-dev

services:
  hearthsound:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "4327:4327"
    command: ["serve", "--config", "/etc/hearthsound/hearthsound.toml"]
    volumes:
      - ./data:/data
      - ./storage:/storage
      - ./hearthsound.toml:/etc/hearthsound/hearthsound.toml:ro
      # A scanned, pre-existing library folder. `HEARTHSOUND_MUSIC_DIR` overrides
      # the default `dev/music`. The mount stays read-only: the server never
      # writes into scanned folders.
      - ${HEARTHSOUND_MUSIC_DIR:-./music}:/music:ro
      # Where acquisition backends leave their downloads for the server to
      # import.
      - ${HEARTHSOUND_IMPORTS_DIR:-./imports}:/imports
    environment:
      HEARTHSOUND__SERVER__BIND: 0.0.0.0
      HEARTHSOUND__PATHS__DATA: /data
      HEARTHSOUND__PATHS__STORAGE: /storage
      HEARTHSOUND__DATABASE__PATH: /data/hearthsound.db
