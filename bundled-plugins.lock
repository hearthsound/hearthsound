# Bundled first-party plugins.
#
# Every released first-party plugin the server ships with is pinned here so a
# build never depends on a mutable download location. The pins are consumed by
# `cargo xtask fetch-plugins [--out <dir>]`, which downloads each archive into
# `target/bundled-plugins/` by default, verifies its `sha256` before writing it,
# and skips an archive that is already present with the pinned digest.
#
# Format: one `[[plugin]]` table per archive, with
#
#   id      reverse-DNS plugin id, as it appears in the plugin's manifest
#   version released plugin version; the release tag is `v<version>`
#   url     direct download URL of the `.hsplugin` release asset
#   sha256  lowercase hex SHA-256 of that asset, checked on every download
#
# The file name an archive is written under is `<id>-<version>.hsplugin`.
# Update a pin only together with a release whose digest was computed from the
# published asset.

[[plugin]]
id = "app.hearthsound.deezer"
version = "0.3.0"
url = "https://github.com/hearthsound/plugin-deezer/releases/download/v0.3.0/app.hearthsound.deezer-0.3.0.hsplugin"
sha256 = "d2f2986cb10c26a6d05f713d248c453b637a94b4ba2da43047328f3551dbf178"

[[plugin]]
id = "app.hearthsound.musicbrainz"
version = "0.3.0"
url = "https://github.com/hearthsound/plugin-musicbrainz/releases/download/v0.3.0/app.hearthsound.musicbrainz-0.3.0.hsplugin"
sha256 = "727dc1db6f4d0cd37d724d25553bd62c1aab24b607d4ed7a885b549db7d6871d"

