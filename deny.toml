[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` is unmaintained and has no successor release; it reaches the tree
  # only through `lofty`, the tag reader and writer. Revisit when lofty drops it.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro used only by lofty; no fixed release exists" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  "AGPL-3.0-or-later",
  "GPL-3.0-or-later",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
]
# The Mozilla CA bundle crates are data licensed CDLA-Permissive-2.0. They are
# allowed by name only, so the license does not become acceptable for code.
exceptions = [
  { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
