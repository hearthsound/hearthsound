[package]
name = "hearthsound"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "hearthsound"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
hearthsound-acquire = { path = "../acquire" }
hearthsound-auth = { path = "../auth" }
hearthsound-config = { path = "../config" }
hearthsound-core = { path = "../core" }
hearthsound-db = { path = "../db" }
hearthsound-library = { path = "../library" }
hearthsound-plugin-host = { path = "../plugin-host" }
hearthsound-server = { path = "../server" }
rpassword.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
uuid.workspace = true

[dev-dependencies]
hearthsound-test-support = { path = "../test-support" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
zip.workspace = true
