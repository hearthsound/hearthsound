[package]
name = "hello-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "A minimal catalog plugin that answers every search with a greeting"
repository = "https://github.com/hearthsound/plugin-template-rust"

[lib]
crate-type = ["cdylib"]

[dependencies]
hearthsound-plugin = { git = "https://github.com/hearthsound/plugin-sdk", tag = "v0.1.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace]
