[package]
name = "hearthsound-api-subsonic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum.workspace = true
hearthsound-activity = { path = "../activity" }
hearthsound-auth = { path = "../auth" }
hearthsound-catalog = { path = "../catalog" }
hearthsound-config = { path = "../config" }
hearthsound-core = { path = "../core" }
hearthsound-db = { path = "../db" }
hearthsound-library = { path = "../library" }
thiserror.workspace = true
time = { workspace = true, features = ["formatting"] }
tracing.workspace = true

[dev-dependencies]
hearthsound-plugin-host = { path = "../plugin-host" }
hearthsound-test-support = { path = "../test-support" }
insta = { workspace = true, features = ["filters"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tower = { workspace = true, features = ["util"] }
