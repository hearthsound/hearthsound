name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info for the workspace crates: CI never runs a debugger, and the
  # info makes every test binary slower to link and the cache larger.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo deny check
      - run: cargo xtask sync-wit --check

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # The media, acquisition, and stream tests generate and decode audio with
      # ffmpeg and ffprobe. A static build is cached, which is much faster than
      # installing the distribution package with its dependencies.
      - id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-n9.0-linux64-gpl
      - if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ffmpeg
          curl -sSfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz \
            | tar xJ -C ~/ffmpeg --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
      - run: echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
      # The fixture plugins only change with their sources or the interface.
      - id: fixtures-cache
        uses: actions/cache@v4
        with:
          path: target/fixtures/plugins
          key: fixtures-${{ hashFiles('crates/test-support/fixtures/**', 'wit/**', 'xtask/src/**', 'rust-toolchain.toml') }}
      - if: steps.fixtures-cache.outputs.cache-hit != 'true'
        run: cargo xtask fixtures
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc
