[workspace]
resolver = "3"
members = [
    "crates/acquire",
    "crates/activity",
    "crates/api-native",
    "crates/api-subsonic",
    "crates/auth",
    "crates/catalog",
    "crates/config",
    "crates/core",
    "crates/db",
    "crates/hearthsound",
    "crates/jobs",
    "crates/library",
    "crates/media",
    "crates/plugin-host",
    "crates/server",
    "crates/test-support",
    "xtask",
]
exclude = ["crates/test-support/fixtures"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
repository = "https://github.com/hearthsound/hearthsound"
publish = false

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = "0.4.45"
bytes = "1.11.1"
clap = { version = "4.6.7", features = ["derive"] }
config = "0.15.27"
croner = "4.0.1"
data-encoding = "2.11.1"
governor = "0.10.4"
futures-util = "0.3.34"
httpdate = "1.0.3"
jsonschema = { version = "0.58.6", default-features = false }
insta = "1.49.0"
md-5 = "0.11.0"
# The content type of a web client file, from its extension.
mime_guess = "2.0.5"
# Plugin index signatures: the verifying half in the plugin host, the signing
# half in its tests.
minisign = "0.10.0"
minisign-verify = "0.3.0"
moka = { version = "0.12.16", features = ["future"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
lofty = "0.25.4"
rand = "0.10.3"
# rustls with the ring provider instead of aws-lc-rs, whose C build dominated a
# cold compile. `rustls-no-provider` leaves the provider to the caller.
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "rustls-no-provider", "stream", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
# The pinned web client embedded into release builds of the server.
rust-embed = "8.13.0"
rpassword = "7.5.4"
# `statvfs` reports the free space of the filesystem the cache lives on.
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
semver = "1.0.28"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
strsim = "0.11.1"
subtle = "2.6.1"
symphonia = { version = "0.6.1", features = ["aac", "alac", "isomp4", "mp3"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = "1.54.1"
toml = "1.1.8"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.25"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
# OpenAPI for the native API.
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["v7"] }
# Only the features the plugin host uses: the defaults add a WAT parser, a
# compile cache with zstd, GC, threads, profiling and debugging support.
wasmtime = { version = "49.0.4", default-features = false, features = ["anyhow", "async", "backtrace", "component-model", "cranelift", "parallel-compilation", "runtime", "std"] }
wasmtime-wasi = { version = "49.0.4", default-features = false, features = ["p2"] }
wiremock = "0.6"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

# Development builds optimize only the dependencies the tests spend their time
# in: password hashing, plugin compilation, SQLite, manifest validation, and
# audio parsing. Everything else, including build scripts and proc macros,
# stays unoptimized so a cold build is fast. No dependency carries debug info.
[profile.dev.package."*"]
debug = false

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.cranelift-bforest]
opt-level = 3

[profile.dev.package.cranelift-bitset]
opt-level = 3

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-control]
opt-level = 3

[profile.dev.package.cranelift-entity]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.jsonschema]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.lofty]
opt-level = 3

[profile.dev.package.md-5]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.symphonia-bundle-flac]
opt-level = 3

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-codec-aac]
opt-level = 3

[profile.dev.package.symphonia-codec-alac]
opt-level = 3

[profile.dev.package.symphonia-codec-pcm]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-format-isomp4]
opt-level = 3

[profile.dev.package.symphonia-format-ogg]
opt-level = 3

[profile.dev.package.symphonia-format-riff]
opt-level = 3

[profile.dev.package.symphonia-metadata]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

[profile.dev.package.wasmtime]
opt-level = 3

[profile.dev.package.wasmtime-environ]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
