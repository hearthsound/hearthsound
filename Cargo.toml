[workspace]
resolver = "3"
members = [
    "crates/acquire",
    "crates/auth",
    "crates/config",
    "crates/core",
    "crates/db",
    "crates/hearthsound",
    "crates/jobs",
    "crates/media",
    "crates/plugin-host",
    "crates/test-support",
    "xtask",
]
exclude = ["crates/test-support/fixtures"]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
repository = "https://github.com/hearthsound/hearthsound"
publish = false

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
chrono = "0.4.45"
bytes = "1.11.1"
clap = { version = "4.6.7", features = ["derive"] }
config = "0.15.27"
croner = "4.0.1"
data-encoding = "2.11.1"
governor = "0.10.4"
futures-util = "0.3.34"
jsonschema = { version = "0.58.6", default-features = false }
md-5 = "0.11.0"
lofty = "0.25.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["stream"] }
semver = "1.0.28"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
strsim = "0.11.1"
subtle = "2.6.1"
symphonia = { version = "0.6.1", features = ["aac", "alac", "isomp4", "mp3"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = "1.53.2"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.25"
uuid = { version = "1.28.0", features = ["v7"] }
wasmtime = "49.0.2"
wasmtime-wasi = "49.0.2"
wiremock = "0.6"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
