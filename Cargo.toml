[workspace]
resolver = "3"
members = [
    "crates/acquire",
    "crates/activity",
    "crates/api-subsonic",
    "crates/auth",
    "crates/catalog",
    "crates/config",
    "crates/core",
    "crates/db",
    "crates/hearthsound",
    "crates/jobs",
    "crates/library",
    "crates/media",
    "crates/plugin-host",
    "crates/server",
    "crates/test-support",
    "xtask",
]
exclude = ["crates/test-support/fixtures"]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
repository = "https://github.com/hearthsound/hearthsound"
publish = false

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = "0.4.45"
bytes = "1.11.1"
clap = { version = "4.6.7", features = ["derive"] }
config = "0.15.27"
croner = "4.0.1"
data-encoding = "2.11.1"
governor = "0.10.4"
futures-util = "0.3.34"
httpdate = "1.0.3"
jsonschema = { version = "0.58.6", default-features = false }
insta = "1.49.0"
md-5 = "0.11.0"
moka = { version = "0.12.16", features = ["future"] }
lofty = "0.25.4"
rand = "0.10.3"
# rustls with the ring provider instead of aws-lc-rs, whose C build dominated a
# cold compile. `rustls-no-provider` leaves the provider to the caller.
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "rustls-no-provider", "stream", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rpassword = "7.5.4"
semver = "1.0.28"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
strsim = "0.11.1"
subtle = "2.6.1"
symphonia = { version = "0.6.1", features = ["aac", "alac", "isomp4", "mp3"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = "1.53.2"
toml = "1.1.8"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.25"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
uuid = { version = "1.28.0", features = ["v7"] }
# Only the features the plugin host uses: the defaults add a WAT parser, a
# compile cache with zstd, GC, threads, profiling and debugging support.
wasmtime = { version = "49.0.3", default-features = false, features = ["anyhow", "async", "backtrace", "component-model", "cranelift", "parallel-compilation", "runtime", "std"] }
wasmtime-wasi = { version = "49.0.3", default-features = false, features = ["p2"] }
wiremock = "0.6"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

# Dependencies are optimized even in development builds: the test suite hashes
# passwords with Argon2, compiles plugin components with Cranelift, and decodes
# audio, all of which are many times slower unoptimized. Dependencies are built
# once and cached, so only the first build pays for it.
[profile.dev.package."*"]
opt-level = 3
debug = false
